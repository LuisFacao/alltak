
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Meu Projeto</h1>
  <div id="conteudo">Carregando...</div>

  <script>
    // Substitua pelas suas chaves do painel do Supabase
    const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
    const SUPABASE_KEY = 'SUA_CHAVE_ANON_PUBLIC';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function buscarDados() {
      const { data, error } = await _supabase.from('sua_tabela').select('*');
      
      if (error) {
        console.error('Erro ao buscar:', error);
        document.getElementById('conteudo').innerText = 'Erro ao carregar dados.';
        return;
      }
      
      document.getElementById('conteudo').innerText = JSON.stringify(data, null, 2);
    }

    buscarDados();
  </script>
</body>
</html>
