<div class="screen-title">
  <h1>
    Calendário
  </h1>
</div>

<div class="cal-wrap">
  <div class="cal-head">
    <h3 id="calendar-month-year"> <!-- mudar aqui -->
      Julho 2026
    </h3>
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="legend">
    <div>
      <span class="sq" style="background:var(--corPrincipal)"></span>
      Campanha
    </div><div>
      <span class="sq" style="background:var(--corClara)"></span>
      Urgente
    </div><div>
      <span class="sq" style="background:var(--ink)"></span>
      Evento
    </div><div>
      <span class="sq" style="background:var(--corSuave)"></span>
      Treinamento
    </div>
  </div>

  <div class="cal-grid" id="cal-grid"></div>
</div>

<div class="cal-day-events" id="cal-day-events"></div>
