<div class="screen-title">
  <h1>
    Mural
  </h1>
</div>

<div class="filters" id="mural-filters">
  <div class="chip on" data-filter="Todos">
    Todos
  </div>

  <div class="chip" data-filter="RH">
    RH
  </div>

  <div class="chip" data-filter="TI">
    TI
  </div>

  <div class="chip" data-filter="Financeiro">
    Financeiro
  </div>

  <div class="chip" data-filter="Eventos">
    Eventos
  </div>
</div>

<div class="search-bar">
  <svg viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7"/>
    <path d="M21 21l-4.3-4.3"/>
  </svg>
  <input type="text" id="search-input" placeholder="Buscar por título...">
</div>

<div class="feed-list" id="mural-grid"></div>

<button type="button" class="btn block admin-only-nav plus" id="mural-post-toggle-btn" onclick="togglePostForm()">
  +
</button>

<div class="card-block" id="mural-post-form-wrap" style="display:none;">
  <h3>
    Novo comunicado
  </h3>
  <form id="post-form" onsubmit="submitPostForm(event)">
    <div class="form-field">
      <label>
        Título
      </label>
      <input type="text" id="post-title" required>
    </div>

    <div class="form-field">
      <label>
        Descrição
      </label>
      <textarea id="post-desc" required></textarea>
    </div>

    <div class="form-field">
      <label>
        Categoria
      </label>
      <select id="post-tag">
        <option>
          RH
        </option><option>
          TI
        </option><option>
          Financeiro
        </option><option>
          Eventos
        </option>
      </select>
    </div>

    <div class="form-field">
      <label>
        Autor
      </label>
      <input type="text" id="post-author" placeholder="Ex: RH Alltak" required>
    </div>

    <div class="checkbox-field">
      <input type="checkbox" id="post-urgent">
      <label for="post-urgent">
        Marcar como urgente
      </label>
    </div>

    <div class="form-field">
      <label>
        Anexos (fotos, vídeos ou documentos — opcional)
      </label>
      <input type="file" id="mural-post-attachments" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" onchange="showFilePreview(this, 'mural-post-attachments-preview')">
      <div id="mural-post-attachments-preview" class="attach-preview"></div>
    </div>

    <button type="submit" class="btn block" id="post-submit-btn">
      Publicar comunicado
    </button>
  </form>
</div>
